<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>

<style>
    :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --text: #1f2937;
        --text-light: #6b7280;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
        --radius: 10px;
        --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    body {
        margin:0;
        padding:0;
        background:var(--bg);
        font-family: "Inter", Arial, sans-serif;
        color:var(--text);
    }

    h2 {
        padding:20px 25px;
        margin:0;
        font-size:26px;
        font-weight:600;
    }

    /* Toolbar */
    .toolbar {
        background:var(--surface);
        padding:15px 25px;
        display:flex;
        gap:15px;
        align-items:center;
        border-bottom:1px solid #e5e7eb;
        box-shadow:var(--shadow);
    }

    .toolbar input, .toolbar select {
        padding:10px 12px;
        background:#f1f5f9;
        border:1px solid #d1d5db;
        border-radius:var(--radius);
        font-size:14px;
        outline:none;
        transition:0.2s;
    }

    .toolbar input:focus, .toolbar select:focus {
        border-color:var(--primary);
        background:white;
    }

    .toolbar button {
        padding:10px 16px;
        border:none;
        cursor:pointer;
        border-radius:var(--radius);
        background:var(--primary);
        color:white;
        font-weight:500;
        transition:0.2s;
    }

    .toolbar button:hover {
        background:var(--primary-hover);
    }

    /* Task List */
    #taskList {
        padding:25px;
        display:flex;
        flex-direction:column;
        gap:15px;
    }

    .task-card {
        background:var(--surface);
        padding:18px 20px;
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        border-left:5px solid var(--primary);
    }

    .task-info {
        max-width:70%;
    }

    .task-title {
        font-size:18px;
        font-weight:600;
        color:var(--text);
    }

    .task-meta {
        margin-top:6px;
        font-size:14px;
        color:var(--text-light);
    }

    .task-actions button {
        background:#e5e7eb;
        color:#111827;
        margin-left:6px;
        padding:8px 12px;
        border:none;
        border-radius:var(--radius);
        cursor:pointer;
        transition:0.2s;
        font-size:13px;
    }

    .task-actions button:hover {
        background:#d1d5db;
    }

    .task-actions .complete-btn {
        background:var(--primary);
        color:white;
    }

    .task-actions .complete-btn:hover {
        background:var(--primary-hover);
    }

    /* Modal */
    .modal {
        display:none;
        position:fixed;
        left:0; top:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.5);
        justify-content:center;
        align-items:center;
        z-index:999;
    }

    .modal-box {
        background:var(--surface);
        width:460px;
        padding:25px;
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        animation:fadeIn 0.25s ease;
        max-height:92vh;
        overflow:auto;
    }

    @keyframes fadeIn {
        from { transform:scale(0.95); opacity:0; }
        to { transform:scale(1); opacity:1; }
    }

    .modal-box h3 {
        margin-top:0;
        font-size:22px;
        font-weight:600;
    }

    .modal-box input,
    .modal-box textarea,
    .modal-box select {
        width:100%;
        padding:10px;
        margin-top:10px;
        border:1px solid #d1d5db;
        border-radius:var(--radius);
        background:#f9fafb;
        font-size:14px;
        outline:none;
        transition:0.2s;
    }

    .modal-box input:focus,
    .modal-box textarea:focus,
    .modal-box select:focus {
        border-color:var(--primary);
        background:white;
    }

    .modal-box button {
        margin-top:15px;
        padding:10px 15px;
        background:var(--primary);
        color:white;
        border:none;
        border-radius:var(--radius);
        cursor:pointer;
        transition:0.2s;
    }

    .modal-box button:hover {
        background:var(--primary-hover);
    }

    .comment {
        background:#f3f4f6;
        padding:10px;
        border-radius:var(--radius);
        margin-bottom:8px;
        font-size:14px;
    }
</style>
</head>

<body>

<h2>Task Management</h2>

<!-- ===================== TOOLBAR ===================== -->
<div class="toolbar">
    <button id="btnCreate">+ Create Task</button>

    <select id="filterStatus">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="blocked">Blocked</option>
        <option value="completed">Completed</option>
    </select>

    <select id="filterPriority">
        <option value="">Priority</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>

    <input id="filterSearch" placeholder="Search task...">

    <button id="btnRefresh">Refresh</button>
</div>


<!-- ===================== TASK LIST ===================== -->
<div id="taskList"></div>


<!-- ===================== CREATE MODAL ===================== -->
<div id="modalCreate" class="modal">
    <div class="modal-box">
        <h3>Create Task</h3>

        <input id="cTitle" placeholder="Title">
        <textarea id="cDescription" placeholder="Description"></textarea>
        <!-- <input id="cAssigned" placeholder="Assign to User ID"> -->
         <select id="cAssigned" placeholder="Assign to User">
            <option></option>
         </select>
        <input id="cCategory" placeholder="Category (optional)">
        <select id="cPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
        </select>
        <input type="date" id="cDue">
        <input id="cTags" placeholder="Tags (comma separated)">

        <button id="btnSaveTask">Save Task</button>
        <button onclick="closeModal('modalCreate')" style="background:#6b7280">Cancel</button>
    </div>
</div>


<!-- ===================== DETAIL MODAL ===================== -->
<div id="modalDetail" class="modal">
    <div class="modal-box">
        <div id="detailContent"></div>

        <h4>Add Comment</h4>
        <textarea id="dComment" placeholder="Write comment..."></textarea>
        <button id="btnAddComment">Add Comment</button>

        <button onclick="closeModal('modalDetail')" style="background:#6b7280; margin-top:20px;">Close</button>
    </div>
</div>


<script>
const API = "/api/tasks";
function openModal(id){ document.getElementById(id).style.display="flex"; }
function closeModal(id){ document.getElementById(id).style.display="none"; }

document.getElementById("btnCreate").onclick = () => openModal("modalCreate");
document.getElementById("btnRefresh").onclick = loadTasks;

async function loadTasks(){
    let qs = [];
    const st = document.getElementById("filterStatus").value;
    const pr = document.getElementById("filterPriority").value;
    const sc = document.getElementById("filterSearch").value;

    if(st) qs.push("status="+st);
    if(pr) qs.push("priority="+pr);
    if(sc) qs.push("search="+encodeURIComponent(sc));

    const url = API + (qs.length ? "?" + qs.join("&") : "");
    const res = await fetch(url);
    const tasks = await res.json();

    renderTasks(tasks);
}

function renderTasks(tasks){
    const box = document.getElementById("taskList");
    box.innerHTML = "";

    if(tasks.length === 0){
        box.innerHTML = "<p style='color:#6b7280;'>No tasks found.</p>";
        return;
    }

    tasks.forEach(t => {
        const card = document.createElement("div");
        card.className = "task-card";

        const info = document.createElement("div");
        info.className = "task-info";
        info.innerHTML = `
            <div class="task-title">${escape(t.title)}</div>
            <div class="task-meta">
                ID #${t.id} • ${t.category || "General"} • Priority: ${t.priority}<br>
                Due: ${t.due_date ? new Date(t.due_date).toLocaleDateString() : "—"}
            </div>
        `;

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const openBtn = document.createElement("button");
        openBtn.textContent = "Open";
        openBtn.onclick = () => openTask(t.id);

        const doneBtn = document.createElement("button");
        doneBtn.textContent = "Completed";
        doneBtn.className = "complete-btn";
        doneBtn.onclick = () => updateStatus(t.id);

        actions.appendChild(openBtn);
        actions.appendChild(doneBtn);

        card.appendChild(info);
        card.appendChild(actions);

        box.appendChild(card);
    });
}

function escape(s){
    return s.replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById("btnSaveTask").onclick = async () => {
    const data = {
        title: document.getElementById("cTitle").value,
        description: document.getElementById("cDescription").value,
        assigned_to: document.getElementById("cAssigned").value,
        category: document.getElementById("cCategory").value,
        priority: document.getElementById("cPriority").value,
        due_date: document.getElementById("cDue").value,
        tags: document.getElementById("cTags").value
    };

    const res = await fetch(API + "/create", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(data)
    });

    const j = await res.json();
    if(j.status === "created"){
        closeModal("modalCreate");
        loadTasks();
    }
};

async function openTask(id){
    openModal("modalDetail");

    const res = await fetch(API + "/" + id);
    const t = await res.json();

    document.getElementById("detailContent").innerHTML = `
        <h3>${escape(t.title)}</h3>
        <p>${escape(t.description || "")}</p>
        <p><b>Status:</b> ${t.status}</p>
        <p><b>Priority:</b> ${t.priority}</p>
        <p><b>Category:</b> ${t.category}</p>
        <p><b>Due:</b> ${t.due_date ? new Date(t.due_date).toLocaleDateString() : "—"}</p>
        <p><b>Tags:</b> ${(t.tags || []).join(", ")}</p>

        <h4>Comments</h4>
        ${(t.comments || []).map(c => `
            <div class="comment">
                <b>User ${c.user_id}</b><br>
                ${escape(c.comment)}<br>
                <small>${new Date(c.created_at).toLocaleString()}</small>
            </div>
        `).join("")}

        <h4>History</h4>
        ${(t.history || []).map(h => `
            <div class="comment">
                <b>${h.action}</b> by User ${h.user_id}<br>
                <small>${new Date(h.created_at).toLocaleString()}</small>
            </div>
        `).join("")}
    `;

    document.getElementById("btnAddComment").onclick = () => addComment(id);
}

async function addComment(id){
    const comment = document.getElementById("dComment").value;

    const res = await fetch(`/api/tasks/${id}/comment`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({comment})
    });

    const j = await res.json();
    if(j.status === "comment_added"){
        document.getElementById("dComment").value = "";
        openTask(id); // reload
    }
}

async function updateStatus(id){
    await fetch(`/api/tasks/${id}/status`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({status:"completed"})
    });
    loadTasks();
}

// first load
loadTasks();
</script>

</body>
</html>
