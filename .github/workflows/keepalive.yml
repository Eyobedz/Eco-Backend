name: Keep Services Awake

on:
  schedule:
    # Two schedules in one workflow
    - cron: "*/10 * * * *"   # every 10 minutes → Render
    - cron: "0 */12 * * *"   # every 12 hours → Aiven
  workflow_dispatch:           # manual trigger

jobs:

  ping_render:
    if: github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -s ${{ secrets.RENDER_URL }} > /dev/null

  ping_aiven:
    if: github.event.schedule == '0 */12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Keep MySQL DB Awake
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h ${{ secrets.DB_HOST }} \
                -P ${{ secrets.DB_PORT }} \
                -u ${{ secrets.DB_USER }} \
                -p${{ secrets.DB_PASSWORD }} \
                -e "SELECT 1;" ${{ secrets.DB_NAME }}
