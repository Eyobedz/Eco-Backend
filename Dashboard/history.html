    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchAndUpdateData();
        });
        
        const notifier = new ToastNotification();
        const loadedData = [];
        let filteredData = [];
        function fetchAndUpdateData() {
            
            const noProductMsg = document.getElementById('noProductMsg');

            waveloader.show();
            noProductMsg.style.display = 'none';
            fetch(`/api/get-history`, { method: 'GET', credentials: "include" })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    console.log(data);
                    data.forEach(row => loadedData.push(row));

                    populateData(data);
                    populateFilter(data);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    notifier.error('Failed to load data. Please try again later.', 3000);
                })
                .finally(() => waveloader.hide());
        }

        function populateFilter(data){
            const userFilter = document.getElementById('user-filter');
            userFilter.innerHTML = ``;
            const uniqueUsers = [...new Set(data.map(row => row.user))];

            uniqueUsers.forEach(user => {
                const list = document.createElement('li');
                list.innerHTML=`
                    <label>
                        <input type="checkbox" onclick="filterAll()" value='${user}'>
                          ${user}
                    </label>
                `
                userFilter.appendChild(list);
            })
            
        }

        function clearFilter() {
            // 1️⃣ Uncheck all checked checkboxes inside filter menus
            const filterMenu = document.querySelectorAll('.filter-dropdown input[type="checkbox"]:checked');
            filterMenu.forEach(option => {
                option.checked = false;
            });

            // 2️⃣ Reset date range picker (if using flatpickr)
            const datePicker = document.querySelector("#dateRangePicker")._flatpickr;
            if (datePicker) {
                datePicker.clear(); // clears the UI
            }

            // 3️⃣ Reset global date range variable
            selectedRange = null;

            // 4️⃣ Re-display all data
            populateData(loadedData);
        }

        function populateData(data) {
            const container = document.getElementById('mainContent');
            const fragment = document.createDocumentFragment();

            container.innerHTML = '';

            data.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'product';

                // ✅ Properly normalize and format date
                let isoDate = "";
                let displayDate = "";

                if (row.date) {
                    const parsed = new Date(row.date);
                    if (!isNaN(parsed)) {
                        // This will be used for filtering
                        isoDate = parsed.toISOString().split("T")[0]; // "YYYY-MM-DD"

                        // This will be shown to the user
                        displayDate = parsed.toLocaleDateString("en-GB", {
                            weekday: "short",
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        });
                    } else {
                        // fallback if parsing fails
                        isoDate = (row.date || '').split(' ')[0].split('T')[0];
                        displayDate = isoDate;
                    }
                }

                const imgElement = row.image_path
                    ? `<img src="${row.image_path}" alt="${row.product_name}" loading="lazy">`
                    : `<img src="/uploads/SPARKE.gif" alt="${row.product_name}" loading="lazy">`;

                const subTotal = row.quantity * row.price;

                // Store ISO date for filtering
                rowDiv.setAttribute("data-date", isoDate);
                rowDiv.innerHTML = `
                    ${imgElement}
                    <h2 class="name">${row.product_name}</h2>
                    <p>${row.operation}</p>
                    <p>${row.user}</p>
                    <p>${row.time}</p>
                `;
                fragment.appendChild(rowDiv);
            });

            container.appendChild(fragment);
            // setupDateFilter();
            // sortProductsByDateAndName();
            noProductMsg.style.display = data.length > 0 ? 'none' : 'block';
        }

        let selectedRange = null; // global variable to remember the last chosen range

        function filterAll(rangeOverride = null) {
            // use the new range if provided, otherwise the last selected one
            if (rangeOverride) selectedRange = rangeOverride;

            const selectedOperations = Array.from(document.querySelectorAll('#operation-filter input[type="checkbox"]:checked'))
                .map(opt => opt.value);
            const selectedUsers = Array.from(document.querySelectorAll('#user-filter input[type="checkbox"]:checked'))
                .map(opt => opt.value);

            const startDate = selectedRange?.[0];
            const endDate = selectedRange?.[1];

            const filteredData = loadedData.filter(row => {
                const matchOperation = selectedOperations.length === 0 || selectedOperations.includes(row.operation);
                const matchUser = selectedUsers.length === 0 || selectedUsers.includes(row.user);


                
                let matchDate = true;
                if (startDate && endDate) {
                    const rowTime = new Date(row.time);
                    if (isNaN(rowTime)) return false;

                    if (startDate.toDateString() === endDate.toDateString()) {
                        matchDate = rowTime.toDateString() === startDate.toDateString();
                    } else {
                        matchDate = rowTime >= startDate && rowTime <= endDate;
                    }
                }

                return matchOperation && matchUser && matchDate;
            });

            populateData(filteredData);
        }

        const fp = flatpickr("#dateRangePicker", {
            mode: "range",
            dateFormat: "d-m-Y",
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    const startDate = selectedDates[0];
