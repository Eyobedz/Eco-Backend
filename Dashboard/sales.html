<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
    <link rel="stylesheet" href="/Elements/toastNotification.css">
    <script defer src="Elements/loading2.js"></script>
    
    <title>Sales</title>

    <style>
        body{
            padding: 0;
            margin: 0;
            /* box-sizing: border-box; */
        }

        .title{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0px;
        }

       .header{
            display: grid;
            grid-template-columns: 110px 1fr 1fr 1fr 1fr 1fr;
            position: sticky;
            top: 0;
            background-color: rgb(0, 0, 0);
            color: white;
            font-size: large;
            font-weight: bold;
            padding: 5px;
            border-radius: 15px;
        }
        
        #mainContent{
            padding: 0;
            margin: 0;
            background-color: rgb(230, 234, 230);
            display: flex;
            flex-direction: column;
        }

        .product{
            display: grid;
            grid-template-columns: 110px 1fr 1fr 1fr 1fr 1fr;
            /* justify-content: space-between; */
            align-items: center;
            background-color: rgba(109, 223, 249, 0.468);
            font-size: large;
            margin: 10px;
            padding: 5px;
            width: 97%;
            border-radius: 15px;

        }

        .product img {
            max-width: 100%;
            max-height: 80px;
        }

    </style>
</head>
<body>
    <h1 style="padding: 0; margin: 0;">Sales</h1>
    <div class="title">
        <p>Date</p>
        <div>
            <input type="date" id="date">
            
        </div>
    </div>  
    <div class="header">
        <p>Image</p>
        <p>Name</p>
        <p>Price</p>
        <p>Quantity</p>
        <p>Sub Total</p>
        <p>Date</p>
    </div>
    <p id="noProductMsg" style="position: absolute; z-index: -1; text-align: center; top: 50%; width: 99%; margin: 10px; font-size: 34px; display: none;">
        No Product Found!!!
   </p>
    <section id="mainContent"></section>

    <script src="/Elements/toastNotification.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchAndUpdateData();
        });
        
        const notifier = new ToastNotification();
        
        function fetchAndUpdateData() {
            const container = document.getElementById('mainContent');
            const fragment = document.createDocumentFragment();
            const noProductMsg = document.getElementById('noProductMsg');

            waveloader.show();

            fetch(`/api/get-sales`, { method: 'GET', credentials: "include" })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    container.innerHTML = '';
        
                    data.forEach(row => {
                        const rowDiv = document.createElement('div');
                        rowDiv.className = 'product';
        
                        // ✅ Properly normalize and format date
                        let isoDate = "";
                        let displayDate = "";
        
                        if (row.date) {
                            const parsed = new Date(row.date);
                            if (!isNaN(parsed)) {
                                // This will be used for filtering
                                isoDate = parsed.toISOString().split("T")[0]; // "YYYY-MM-DD"
        
                                // This will be shown to the user
                                displayDate = parsed.toLocaleDateString("en-GB", {
                                    weekday: "short",
                                    day: "2-digit",
                                    month: "short",
                                    year: "numeric"
                                });
                            } else {
                                // fallback if parsing fails
                                isoDate = (row.date || '').split(' ')[0].split('T')[0];
                                displayDate = isoDate;
                            }
                        }
        
                        const imgElement = row.image_path
                            ? `<img src="${row.image_path}" alt="${row.product_name}" loading="lazy">`
                            : '';
        
                        const subTotal = row.quantity * row.price;
        
                        // Store ISO date for filtering
                        rowDiv.setAttribute("data-date", isoDate);
                        rowDiv.innerHTML = `
                            ${imgElement}
                            <h2 class="name">${row.product_name}</h2>
                            <p>ETB ${row.price.toLocaleString()}</p>
                            <p>${row.quantity.toLocaleString()}</p>
                            <p>ETB ${subTotal.toLocaleString()}</p>
                            <p class="date">${displayDate}</p>
                        `;
        
                        fragment.appendChild(rowDiv);
                    });
        
                    container.appendChild(fragment);
                    noProductMsg.style.display = container.length > 0 ? 'none' : 'block';

                    setupDateFilter();
                    sortProductsByDateAndName();
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    notifier.error('Failed to load data. Please try again later.', 3000);
                })
                .finally(() => waveloader.hide());
        }
        
        function setupDateFilter() {
            const dateInput = document.getElementById("date");
            const noProductMsg = document.querySelector('p[style*="No Product Found"]');
        
            dateInput.addEventListener("input", function () {
                const selectedDate = this.value; // "YYYY-MM-DD"
                const rows = document.querySelectorAll(".product");
                let visibleCount = 0;
        
                rows.forEach(row => {
                    const rowDate = row.getAttribute("data-date");
                    if (!selectedDate || rowDate === selectedDate) {
                        row.style.display = "grid";
                        visibleCount++;
                    } else {
                        row.style.display = "none";
                    }
                });
        
                noProductMsg.style.display = visibleCount ? "none" : "block";
            });
        }
        
        function sortProductsByDateAndName() {
            const container = document.getElementById("mainContent");
            const rows = Array.from(container.querySelectorAll(".product"));
        
            rows.sort((a, b) => {
                const dateA = new Date(a.getAttribute("data-date"));
                const dateB = new Date(b.getAttribute("data-date"));
        
                if (dateA.getTime() !== dateB.getTime()) {
                    return dateB - dateA; // newest first
                }
        
                const nameA = a.querySelector("h2").textContent.trim().toLowerCase();
                const nameB = b.querySelector("h2").textContent.trim().toLowerCase();
        
                return nameA.localeCompare(nameB);
            });
        
            rows.forEach(row => container.appendChild(row));
        }
        </script>
        
</body>
</html>
