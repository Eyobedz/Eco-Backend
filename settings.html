    /* Base popover styling */

[popover]:popover-open {

/* Headings inside popovers */

[popover] input:focus {

}

/* Optional buttons for popover actions */
.popover-actions {

<script>


const notifier = new ToastNotification();
document.addEventListener("DOMContentLoaded", () => {
    fetchProfileData();
    loadsettings();
    changePassword();
    fileUpload();
    editProfile();
    crop();
});



function fetchProfileData() {
  const profileCard = document.getElementById('profile-card');
  // profileCard.classList.add('blurred');
  fetch("/api/get-profile", { credentials: "include" })
    .then(res => {
        if (!res.ok) throw new Error("Failed to fetch profile");
        return res.json();
    })
    .then(data => {
        const pp = data.pp_url !== 'none' ? data.pp_url : '/uploads/SPARKE.gif';
        document.getElementById("profile-pic").src = pp;
        document.getElementById("fullname").textContent = data.full_name;
        document.getElementById("username").textContent = `Username: ${data.username}`;
        document.getElementById("user_type").textContent = `Role: ${data.user_type}`;
        document.getElementById("user_email").textContent = `Email: ${data.user_email}`;
        document.getElementById("user_id").value = data.user_id;

        document.getElementById("full_name").value = data.full_name;
        document.getElementById("userName").value = data.username;
        document.getElementById("userEmail").value = data.user_email;
        document.getElementById("userId").value = data.user_id;
        profileCard.classList.remove('blurred');

    })
    .catch(error => {
            console.error('Error fetching data:', error.message || error);
            // alert('Failed to load data. Please try again later.');
            notifier.error('Failed to load profile data. Please try again later.');

        })
};

function show_Password() {
  const passwordFields = document.querySelectorAll("#old_password, #new_password, #confirm_password");
    let show = passwordFields[0].type === "password"; // check first field

    passwordFields.forEach(input => {
        input.type = show ? "text" : "password";
    });
}

function fileUpload(){
  document.getElementById('editprofile').hidePopover()

  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');

  fileInput.addEventListener('change', () => {
    preview.innerHTML = ''; // clear old preview

    const file = fileInput.files[0];
    if (!file) {
      preview.innerHTML = '<p class="file-name">No file selected</p>';
      return;
    }

    if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    } else {
      const p = document.createElement('p');
      p.className = 'file-name';
      p.textContent = `📄 ${file.name}`;
      preview.appendChild(p);
    }
  });
}

function editProfile() {
    document.getElementById("editprofile").addEventListener("submit", function(e) {
        e.preventDefault();

        waveloader.show();

        const formData = new FormData();
        const fileData = new FormData();
        formData.append('id', document.getElementById('user_id').value);
        formData.append('full_name', document.getElementById('full_name').value);
        formData.append('username', document.getElementById('userName').value);

        const imageFile = document.getElementById('fileInput').files[0];
        if (imageFile){
          formData.append('fileInput', imageFile);
        }
        fetch('/api/update-profile', {
            method: 'POST',
            body: formData,
            credentials: "include"
        })
        .then(async res => {
            const data = await res.json();

            if (!res.ok) {
                // backend sends "error" and "message"
                notifier.error(data.message || data.error || "Failed to Edit Profile");

                document.getElementById("Editmessage").textContent = data.message || data.error;
                document.getElementById("Editmessage").style.display = "block";
                throw new Error(data.message || data.error);
            }else{
                notifier.success(data.message || 'Profile Updated Successfully');
                fetchProfileData();
                document.getElementById('editprofile').hidePopover();
            }

            return data;
        })
        .catch(err => {
            console.error(err);
            // already shown notifier.error above
        })

        .finally(() => {
            waveloader.hide();
        });
    });

}

function changePassword() {
    document.getElementById("changepassword").addEventListener("submit", function(e) {
        e.preventDefault();

        waveloader.show();

        const formData = new FormData();
        formData.append('user_id', document.getElementById('user_id').value);
        formData.append('old_password', document.getElementById('old_password').value);
        formData.append('new_password', document.getElementById('new_password').value);
        formData.append('confirm_password', document.getElementById('confirm_password').value);

        fetch('/api/change-password', {
            method: 'POST',
            body: formData,
            credentials: "include"
        })
        .then(async res => {
            const data = await res.json();  // ✅ always parse response JSON

            if (!res.ok) {
                // backend sends "error" and "message"
                notifier.error(data.message || data.error || "Failed to change password");

                document.getElementById("message").textContent = data.message || data.error;
                document.getElementById("message").style.display = "block";
                throw new Error(data.message || data.error);
            }

            return data;
        })
        .then(data => {
            // ✅ backend only returns "message"
            document.getElementById('old_password').value = '';
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
            document.getElementById("changepassword").hidePopover();
            notifier.success(data.message || 'Password Changed Successfully');
        })
        .catch(err => {
            console.error(err);
            // already shown notifier.error above
        })
        .finally(() => {
            waveloader.hide();
        });
    });
}

function crop() {
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const modal = document.getElementById('modal');
  const cropImage = document.getElementById('cropImage');
  const cropBtn = document.getElementById('cropBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const editProfilePopover = document.getElementById('editprofile');
  let cropper;

  // ✅ Remove any previous listeners before re-adding
  fileInput.onchange = null;
  cropBtn.onclick = null;
  cancelBtn.onclick = null;

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      preview.innerHTML = `<p class="file-name">${file.name}</p>`;
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      cropImage.src = reader.result;

      // ✅ Hide the popover immediately
      if (editProfilePopover.hidePopover) {
        editProfilePopover.hidePopover();
      }

      modal.style.display = 'flex';

      if (cropper) cropper.destroy();

      cropper = new Cropper(cropImage, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.9,
        responsive: true,
        background: false,
        movable: true,
        zoomable: true,
        scalable: true,
      });
    };
    reader.readAsDataURL(file);
  });

  cropBtn.addEventListener('click', () => {
    if (!cropper) return;

    const canvas = cropper.getCroppedCanvas({
      width: 400,
      height: 400,
    });

    const croppedImage = document.createElement('img');
    croppedImage.src = canvas.toDataURL('image/png');
    croppedImage.alt = 'Profile Picture';
    preview.innerHTML = '';
    preview.appendChild(croppedImage);

    modal.style.display = 'none';
    cropper.destroy();
    cropper = null;

    // ✅ Delay showing popover slightly (ensure modal is gone)
    setTimeout(() => {
      if (editProfilePopover.showPopover) {
        editProfilePopover.showPopover();
      }
    }, 150);
  });

  cancelBtn.addEventListener('click', () => {
    modal.style.display = 'none';
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }

    // ✅ Also delay popover restore for smoother transition
    setTimeout(() => {
      if (editProfilePopover.showPopover) {
        editProfilePopover.showPopover();
      }
    }, 150);
  });
}



function loadsettings(){
  const stock_threshold_section = document.getElementById('stock_threshold');
  const exdate_threshold_section = document.getElementById('exdate_threshold');
  const inventoryCard = document.getElementById('inventory-card');

  fetch(`/api/get-settings`, { method: 'GET', credentials: "include" })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        })
        .then(data => {
            const result = data[0];
            const exdate = data[1];
            const system_settings = data[5];
            // console.log(system_settings);

            exdate_threshold_section.querySelector('input').placeholder = exdate

            
            stock_threshold_section.innerHTML=`<label class="title">Low Stock Threshold</label>`
            result.forEach(row =>{
              const input = document.createElement('section')
              input.className = 'unit_input'
              input.innerHTML = `
              <label>${row.name}:</label>
              <input type='number' class='low_stock' id='${row.name}' unitId='${row.unit_id}' placeholder= "${row.stock_threshold}">  
              <label>${row.symbol}</label>
              `
              stock_threshold_section.appendChild(input)
            })
            inventoryCard.classList.remove('blurred');
            console.log(data[3]);
            loadnotificationSetting(data[3])
            const tax_rate = system_settings[0]['TAX'];
            console.log(tax_rate);
            tax_input.querySelector('input').placeholder = tax_rate;
        })
        .catch(error => {
            console.error('Error fetching data:', error.message || error);
            // alert('Failed to load data. Please try again later.');
            notifier.error('Failed to load settings data. Please try again later.');

        })
}



function loadnotificationSetting(notification_option){
  const notificationCard = document.getElementById('notification-card');
  const inAppToggle = document.getElementById('inAppToggle');
  const emailToggle = document.getElementById('emailToggle');
  if(notification_option === 'InApp'){
    inAppToggle.checked = true;
  }else if(notification_option === 'Email'){
    emailToggle.checked = true;
  }else if(notification_option === 'Both'){
    emailToggle.checked = true;
    inAppToggle.checked = true;
  }
  notificationCard.classList.remove('blurred');
}

function saveInventorySettings(){
 
  const inventory_settings = document.getElementById('inventory-card');
  const formData = new FormData();
  const low_stock_threshold = document.querySelectorAll('.low_stock');
  
  low_stock_threshold.forEach(item => {
    const unitId = item.getAttribute('unitId')
    if(item.value !== ''){
      formData.append(unitId, item.value)
    }
  });
const exp = document.getElementById('expiration_alert_days').value
const tax = document.getElementById('tax_rate').value

if (exp !== '') {
  formData.append('expiration_alert_days', exp);
}

if (tax !== '') {
  formData.append('tax_rate', tax);
}

  console.log(formData)
  if(!formData.entries().next().value){
    console.log('No value entered')
    notifier.error('No Value Entered. Enter a vlaue and try again.')
    return;
  }

  fetch(`/api/save-inventory-settings`, {
      method: 'POST',
      credentials: "include",
      body: formData })
          .then(response => {
              if (!response.ok) {
                  throw new Error('Network response was not ok ' + response.statusText);
              }
              return response.json();
          })
          .then(data => {
              console.log(data);
              notifier.success('Inventory settings saved successfully');
              loadsettings();

          })
          .catch(err => {
              console.error(err);
              notifier.error(error.message || 'Failed to save inventory settings. Please try again later.');
          })
          .finally(() => {
              waveloader.hide();
          });
}

function saveNotificationSettings(){
  const inApp = document.getElementById('inAppToggle').checked;
  const email = document.getElementById('emailToggle').checked;
  const formData = new FormData()
  if (inApp && email){
    formData.append('notification', 'Both')

  }else if(inApp){
    formData.append('notification', 'InApp')
  }else if(email){
    formData.append('notification', 'Email')
  }else{
    formData.append('notification', 'None')
  };

  // const notification_option = document.getElementById('inAppToggle').checked ? 'InApp' : document.getElementById('emailToggle').checked ? 'Email' : 'Both';
  fetch(`/api/save-notification-settings`, { 
      method: 'POST', 
      credentials: "include",
      body:formData })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        })
        .then(data => {
            // console.log(data);
            notifier.success(data.message)
        })
        .catch(err => {
            console.error(err);
            notifier.error('Failed to save inventory settings. Please try again later.')
        })
        .finally(() => {
            waveloader.hide();
        });
}
