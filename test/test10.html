<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Image Crop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .file-label {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #fileInput {
      display: none;
    }

    .image-container {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #cropImage {
      max-width: 100%;
      max-height: 70vh;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }

    button.cancel {
      background-color: #6c757d;
    }
  </style>
</head>
<body>
  <label class="file-label" for="fileInput">Choose Profile Image</label>
  <input type="file" id="fileInput" accept="image/*">

  <div class="image-container">
    <img id="preview" alt="Profile Preview">
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <img id="cropImage">
      <div class="buttons">
        <button id="cropBtn">Crop</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const modal = document.getElementById('modal');
    const cropImage = document.getElementById('cropImage');
    const cropBtn = document.getElementById('cropBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    let cropper;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          cropImage.src = reader.result;
          modal.style.display = 'flex';
          if (cropper) cropper.destroy();

          // Initialize cropper with scalable 1:1 ratio
          cropper = new Cropper(cropImage, {
            aspectRatio: 1,
            viewMode: 1,
            responsive: true,
            background: false,
            autoCropArea: 0.8, // Start with 80% of image covered
            movable: true,
            zoomable: true,
            scalable: true,
          });
        };
        reader.readAsDataURL(file);
      }
    });

    cropBtn.addEventListener('click', () => {
      const canvas = cropper.getCroppedCanvas({
        width: 400,
        height: 400,
      });

      preview.src = canvas.toDataURL();
      preview.style.display = 'block';
      modal.style.display = 'none';
      cropper.destroy();
    });

    cancelBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      if (cropper) cropper.destroy();
    });
  </script>
</body>
</html>
